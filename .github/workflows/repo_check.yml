name: repo-check

# 每次 push 跑两件只用标准库的事，几十秒完成：
#   1) 全仓 Python 语法自检
#   2) skill 的链路判定工具自检（读 .hwh 与 Vivado 报告，只读不碰硬件）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: Python 语法自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: compileall
        run: python -m compileall -q host skill training

  selftest:
    name: skill 自检（hwh 结构 + 时序/资源）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: skill/selftest
        run: python skill/selftest.py
